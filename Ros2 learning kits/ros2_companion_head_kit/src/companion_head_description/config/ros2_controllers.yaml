# ros2_controllers.yaml - Controller configuration for Companion Head
#
# LEARNING OBJECTIVES:
# ====================
# 1. Understand controller manager configuration
# 2. Learn about joint trajectory controller
# 3. See position controller setup

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    position_controller:
      type: position_controllers/JointGroupPositionController


joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0  # Hz


joint_trajectory_controller:
  ros__parameters:
    joints:
      - neck_pan_joint
      - neck_tilt_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0


position_controller:
  ros__parameters:
    joints:
      - neck_pan_joint
      - neck_tilt_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity
