# ros2_controllers.yaml - Quadruped Robot Controller Configuration
#
# Control Hierarchy:
# - joint_state_broadcaster: Publishes /joint_states for robot_state_publisher
# - leg_controller: Effort control for all 12 joints (MPC computes torques)
# - imu_broadcaster: Publishes /imu/data for state estimation
#
# Rate: 1000 Hz update rate for responsive legged locomotion

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz - high rate for legged robots

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_controller:
      type: effort_controllers/JointGroupEffortController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster




leg_controller:
  ros__parameters:
    joints:
      - FL_HAA
      - FL_HFE
      - FL_KFE
      - FR_HAA
      - FR_HFE
      - FR_KFE
      - RL_HAA
      - RL_HFE
      - RL_KFE
      - RR_HAA
      - RR_HFE
      - RR_KFE

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity
      - effort


imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
