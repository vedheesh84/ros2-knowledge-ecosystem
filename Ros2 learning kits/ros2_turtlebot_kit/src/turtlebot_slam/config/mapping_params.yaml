# SLAM Toolbox Mapping Configuration
# ===================================
#
# LEARNING OBJECTIVES:
# - Understand SLAM pose graph construction
# - See scan matching parameters
# - Learn loop closure configuration
#
# MODE: Online async mapping
# Creates map while robot moves, publishes map->odom TF

slam_toolbox:
  ros__parameters:
    # ========================================
    # SOLVER CONFIGURATION
    # ========================================
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ========================================
    # FRAME CONFIGURATION
    # ========================================
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # ========================================
    # MODE CONFIGURATION
    # ========================================
    mode: mapping  # 'mapping' or 'localization'
    use_map_saver: true

    # ========================================
    # TIMING
    # ========================================
    transform_publish_period: 0.02   # 50 Hz map->odom TF
    map_update_interval: 5.0         # Update map every 5 seconds
    resolution: 0.05                 # 5 cm map resolution

    # ========================================
    # SCAN MATCHING
    # ========================================
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3     # 30 cm before new scan
    minimum_travel_heading: 0.3      # 0.3 rad before new scan
    scan_buffer_size: 10

    # ========================================
    # LOOP CLOSURE
    # ========================================
    # LEARNING: Loop closure corrects accumulated drift
    # When robot revisits an area, SLAM detects this and
    # optimizes the pose graph to fix inconsistencies.

    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ========================================
    # LASER CONFIGURATION
    # ========================================
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ========================================
    # MAP CONFIGURATION
    # ========================================
    map_file_name: ""  # Set when saving
    map_start_at_dock: false
