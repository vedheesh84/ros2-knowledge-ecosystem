# SLAM Toolbox Localization Configuration
# ========================================
#
# LEARNING OBJECTIVES:
# - Understand localization mode vs mapping mode
# - See how SLAM uses a saved map
# - Learn pose graph matching
#
# MODE: Localization (uses existing map)
# Does NOT modify the map, only localizes within it

slam_toolbox:
  ros__parameters:
    # ========================================
    # SOLVER CONFIGURATION
    # ========================================
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ========================================
    # FRAME CONFIGURATION
    # ========================================
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # ========================================
    # MODE CONFIGURATION
    # ========================================
    # LEARNING: 'localization' mode uses saved map
    # It matches current scans against pose graph
    mode: localization

    # ========================================
    # MAP FILE
    # ========================================
    # LEARNING: Set this to your saved map file
    # The map was saved using mapping mode + map_saver
    map_file_name: ""  # Set via launch parameter

    # ========================================
    # TIMING
    # ========================================
    transform_publish_period: 0.02   # 50 Hz map->odom TF
    map_update_interval: 5.0
    resolution: 0.05

    # ========================================
    # SCAN MATCHING
    # ========================================
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10

    # ========================================
    # LOOP CLOSURE (disabled in localization)
    # ========================================
    # LEARNING: In localization mode, we don't need
    # loop closure because the map is already optimized
    do_loop_closing: false

    # ========================================
    # LASER CONFIGURATION
    # ========================================
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
